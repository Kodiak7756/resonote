<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonote — Music Theory & Praxis</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/pedals.css">
  <link rel="stylesheet" href="/src/styles/kit.css">
  <link rel="stylesheet" href="/src/styles/fretboard.css">
  <link rel="stylesheet" href="/src/styles/dock.css">
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="session-bar" style="display:flex;gap:8px;padding:4px 10px;flex-wrap:wrap"></div>
  <!-- The TAB page sits ABOVE the neck: staff, tab, piano roll and waveform stack
       on one shared axis so they read against each other, and the fretboard follows
       underneath (collapsible from the page's own 🎸 Neck button). -->
  <div id="tab-mode" style="display:none"></div>
  <div id="instrument-bar"></div>
  <div id="instrument-display"></div>
  <div id="board-area">
    <div id="board-bg"></div>
  </div>
  <div id="studio-mode" style="display:none"></div>
  <!-- Pedals are a VIEWPORT layer, not board furniture: they float over the neck,
       the tab lane and the studio alike, so a reference is always in reach while
       you play. Kept outside the pages so switching pages never hides them. -->
  <div id="focus-bar"><button id="btn-focus" class="dock-chip mono" title="Focus mode — dock everything, give the neck the room">FOCUS</button></div>
  <div id="pedal-dock"></div>
  <div id="pedals-container"></div>
  <div id="catalog-drawer"></div>
  <div id="help-overlay"></div>
  <div id="board-zoom-ctrl"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
